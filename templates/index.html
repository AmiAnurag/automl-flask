<!DOCTYPE html>
<html>
<head>
    <title>AutoML Tool 🤖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">📂 Upload Your CSV File</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <input type="file" name="file" class="form-control" accept=".csv" required />
        </div>
        <button type="submit" class="btn btn-primary">Upload 🚀</button>
    </form>

    {% if filename %}
        <hr />
        <h4 class="mt-4">✅ Uploaded File: {{ filename }}</h4>
        <a href="/prepare" class="btn btn-warning mt-2">Prepare Features 🧠</a>

        <h5 class="mt-5">📈 Column-wise Visualizations</h5>
        <div class="row">
            {% for graph in graph_paths %}
                <div class="col-md-6 mb-4">
                    <img src="{{ url_for('static', filename=graph) }}" class="img-fluid border" />
                </div>
            {% endfor %}
        </div>
    {% endif %}
</body>
</html>
